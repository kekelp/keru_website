<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ config.title }}</title>
    <style>
        :root {
            color-scheme: dark;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            padding: 2rem 1rem;
            background: #0d0d10;
            color: #f2f2f2;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        h1 {
            margin: 0;
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 800;
            letter-spacing: 0.02em;
        }
        .carousel {
            position: relative;
            width: min(900px, 100%);
        }
        .stage {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        .stage video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
            transition: opacity 0.35s ease;
            pointer-events: none;
        }
        .stage video.active {
            opacity: 1;
            pointer-events: auto;
        }
        .nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 50%;
            background: rgba(20, 20, 24, 0.6);
            color: #fff;
            font-size: 1.6rem;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
            z-index: 2;
        }
        .nav:hover {
            background: rgba(60, 60, 70, 0.85);
        }
        .nav.prev { left: 12px; }
        .nav.next { right: 12px; }
        .dots {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 1rem;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: none;
            padding: 0;
            background: #444;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
        }
        .dot.active {
            background: #f2f2f2;
            transform: scale(1.25);
        }
    </style>
</head>
<body>
    <h1>{{ config.title }}</h1>

    <div class="carousel">
        <div class="stage" id="stage">
            {% for video in config.extra.videos %}
            <video src="{{ get_url(path='videos/' ~ video) }}" muted playsinline preload="metadata"></video>
            {% endfor %}
        </div>
        <button class="nav prev" id="prev" aria-label="Previous">&#8249;</button>
        <button class="nav next" id="next" aria-label="Next">&#8250;</button>
        <div class="dots" id="dots"></div>
    </div>

    <script>
        (function () {
            const videos = Array.from(document.querySelectorAll('#stage video'));
            const dotsWrap = document.getElementById('dots');
            let index = 0;

            const dots = videos.map(function (_, i) {
                const dot = document.createElement('button');
                dot.className = 'dot';
                dot.setAttribute('aria-label', 'Video ' + (i + 1));
                dot.addEventListener('click', function () { show(i); });
                dotsWrap.appendChild(dot);
                return dot;
            });

            function show(i) {
                index = (i + videos.length) % videos.length;
                videos.forEach(function (v, j) {
                    const active = j === index;
                    v.classList.toggle('active', active);
                    dots[j].classList.toggle('active', active);
                    if (active) {
                        v.currentTime = 0;
                        v.play().catch(function () {});
                    } else {
                        v.pause();
                    }
                });
            }

            document.getElementById('prev').addEventListener('click', function () { show(index - 1); });
            document.getElementById('next').addEventListener('click', function () { show(index + 1); });

            // Advance when the current video ends (loop is off-loop for autoplay-through feel).
            videos.forEach(function (v) {
                v.addEventListener('ended', function () { show(index + 1); });
            });

            show(0);
        })();
    </script>
</body>
</html>
