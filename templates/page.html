{% extends "base.html" %}

{% block title %}{{ page.title }} - {{ config.title | default(value="Blog") }}{% endblock %}

{% block content %}
<article>
    <header class="post-header">
        <h1>{{ page.title }}</h1>
        {% if page.date %}<time datetime="{{ page.date }}">{{ page.date | date(format="%Y-%m-%d") }}</time>{% endif %}
    </header>
    {{ page.content | safe }}
</article>
{% endblock %}
