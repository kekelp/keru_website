<script>
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    var playing = null;

    function autoPlay(v) { if (v.paused) { v._auto = true; v.play(); } }
    function autoPause(v) { if (!v.paused) { v._auto = true; v.pause(); } }

    document.querySelectorAll('.video-tile').forEach(function (v) {
        if (v.tagName !== 'VIDEO') return;

        v.addEventListener('play', function () {
            if (v._auto) { v._auto = false; return; }
            v._manual = 'play';
        });
        v.addEventListener('pause', function () {
            if (v._auto) { v._auto = false; return; }
            v._manual = 'pause';
        });

        v.addEventListener('mouseenter', function () {
            v.setAttribute('controls', '');
            if (reduceMotion.matches) return;
            if (playing && playing !== v && playing._manual !== 'play') autoPause(playing);
            if (v._manual !== 'pause') { autoPlay(v); playing = v; }
        });
        v.addEventListener('mouseleave', function () {
            v.removeAttribute('controls');
        });
    });
</script>

    </main>
    <script>
        var DARK = 'dark', LIGHT = 'light';
        var root = document.documentElement;
        var toggle = document.getElementById('theme-toggle');
        var sun = document.getElementById('icon-sun');
        var moon = document.getElementById('icon-moon');

        function isDark() {
            var t = root.getAttribute('data-theme');
            return t ? t === DARK : window.matchMedia('(prefers-color-scheme: dark)').matches;
        }
        function showIcon(dark) {
            sun.style.display = dark ? 'block' : 'none';
            moon.style.display = dark ? 'none' : 'block';
        }
        function apply(dark) {
            root.setAttribute('data-theme', dark ? DARK : LIGHT);
            showIcon(dark);
            toggle.setAttribute('aria-pressed', dark ? 'true' : 'false');
            try { localStorage.setItem('theme', dark ? DARK : LIGHT); } catch (e) {}
        }

        showIcon(isDark());
        toggle.setAttribute('aria-pressed', isDark() ? 'true' : 'false');
        toggle.addEventListener('click', function () {
            apply(!isDark());
        });
    </script>
