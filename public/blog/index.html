<html lang="en">
<head>
    <meta charset="utf-8">

    <title>Blog - Keru</title>
    <link rel="stylesheet" href="https://kekelp.github.io/keru/style.css">
    <script>
        try {
            var t = localStorage.getItem('theme');
            if (t) document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
    </script>
</head>
<body>
    <nav>
        <a href="https://kekelp.github.io/keru">Keru</a>
        <a href="https://kekelp.github.io/keru/blog">Blog</a>

        <a href="https://github.com/kekelp/keru"> Code </a>

        <button
            id="theme-toggle"
            class="theme-toggle"
            aria-label="Toggle dark mode"
            aria-pressed="false"
        >
            <svg id="icon-sun" class="theme-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
            </svg>
            <svg id="icon-moon" class="theme-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </button>
    </nav>
    <main>
        
<p>This is a blog about the Keru GUI library and its development.</p>


<ul class="posts">
    
    <li>
        <a href="https://kekelp.github.io/keru/blog/on-immediate-mode/">On &quot;Immediate Mode&quot;</a>
        <time datetime="2026-08-22">2026-08-22</time>
    </li>
    
    <li>
        <a href="https://kekelp.github.io/keru/blog/layout/">A New GUI Layout Algorithm?</a>
        <time datetime="2026-08-21">2026-08-21</time>
    </li>
    
    <li>
        <a href="https://kekelp.github.io/keru/blog/interface/">Looking for the Perfect GUI Library Interface</a>
        <time datetime="2026-08-19">2026-08-19</time>
    </li>
    
</ul>

    </main>
    <script>
        var DARK = 'dark', LIGHT = 'light';
        var root = document.documentElement;
        var toggle = document.getElementById('theme-toggle');
        var sun = document.getElementById('icon-sun');
        var moon = document.getElementById('icon-moon');

        function isDark() {
            var t = root.getAttribute('data-theme');
            return t ? t === DARK : window.matchMedia('(prefers-color-scheme: dark)').matches;
        }
        function showIcon(dark) {
            sun.style.display = dark ? 'block' : 'none';
            moon.style.display = dark ? 'none' : 'block';
        }
        function apply(dark) {
            root.setAttribute('data-theme', dark ? DARK : LIGHT);
            showIcon(dark);
            toggle.setAttribute('aria-pressed', dark ? 'true' : 'false');
            try { localStorage.setItem('theme', dark ? DARK : LIGHT); } catch (e) {}
        }

        showIcon(isDark());
        toggle.setAttribute('aria-pressed', isDark() ? 'true' : 'false');
        toggle.addEventListener('click', function () {
            apply(!isDark());
        });
    </script>
</body>
</html>
