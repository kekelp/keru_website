<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <link rel="stylesheet" href="https://example.com/style.css">
    <script>
        try {
            var t = localStorage.getItem('theme');
            if (t) document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
    </script>
</head>
<body>
    <nav>
        <a class="brand" href="https://example.com">keru</a>
        <a href="https://example.com/blog">blog</a>
        <a href="https://github.com/kekelp/keru">github</a>
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode"><span id="theme-label"></span> ◐</button>
    </nav>
    <main>
        
<h1>Welcome</h1>
<p>This is the front page. More to come.</p>
<p><a href="https://example.com/blog">Read the blog →</a></p>

    </main>
    <script>
        // 'dark'/'light' only appear here, at the DOM boundary: they're the
        // contract with the CSS ([data-theme="..."]). Everything else is a boolean.
        var DARK = 'dark', LIGHT = 'light';
        var root = document.documentElement;
        var label = document.getElementById('theme-label');

        function isDark() {
            var t = root.getAttribute('data-theme');
            return t ? t === DARK : window.matchMedia('(prefers-color-scheme: dark)').matches;
        }
        function apply(dark) {
            var name = dark ? DARK : LIGHT;
            root.setAttribute('data-theme', name);
            label.textContent = name;
            try { localStorage.setItem('theme', name); } catch (e) {}
        }

        label.textContent = isDark() ? DARK : LIGHT;
        document.getElementById('theme-toggle').addEventListener('click', function () {
            apply(!isDark());
        });
    </script>
</body>
</html>
