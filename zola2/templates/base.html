<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ config.title | default(value="Blog") }}{% endblock %}</title>
    <link rel="stylesheet" href="{{ get_url(path='style.css') }}">
    <script>
        try {
            var t = localStorage.getItem('theme');
            if (t) document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
    </script>
</head>
<body>
    <nav>
        <a href="{{ get_url(path='/blog') }}">Blog</a>
        <a class="brand" href="{{ get_url(path='/') }}">Keru</a>
        <button
            id="theme-toggle"
            class="theme-toggle"
            aria-label="Toggle dark mode"
        >
            <span id="theme-label"></span> ◐
        </button>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
    <script>
        // 'dark'/'light' only appear here, at the DOM boundary: they're the
        // contract with the CSS ([data-theme="..."]). Everything else is a boolean.
        var DARK = 'dark', LIGHT = 'light';
        var root = document.documentElement;
        var label = document.getElementById('theme-label');

        function isDark() {
            var t = root.getAttribute('data-theme');
            return t ? t === DARK : window.matchMedia('(prefers-color-scheme: dark)').matches;
        }
        // Capitalized label for display, lowercase discriminant for the CSS.
        function labelFor(dark) {
            return dark ? 'Dark' : 'Light';
        }
        function apply(dark) {
            root.setAttribute('data-theme', dark ? DARK : LIGHT);
            label.textContent = labelFor(dark);
            try { localStorage.setItem('theme', dark ? DARK : LIGHT); } catch (e) {}
        }

        label.textContent = labelFor(isDark());
        document.getElementById('theme-toggle').addEventListener('click', function () {
            apply(!isDark());
        });
    </script>
</body>
</html>
