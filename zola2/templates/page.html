{% extends "base.html" %}

{% block title %}{{ page.title }} — {{ config.title | default(value="Blog") }}{% endblock %}

{% block content %}
<article>
    <h1>{{ page.title }}</h1>
    {% if page.date %}<time>{{ page.date | date(format="%Y-%m-%d") }}</time>{% endif %}
    {{ page.content | safe }}
</article>
{% endblock %}
