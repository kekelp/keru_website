<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #0f1417;
    color: #e6edf3;
  }
  header {
    padding: 1rem 1.25rem;
    border-bottom: 1px solid #232b31;
  }
  header h1 { margin: 0; font-size: 1.1rem; }
  header p { margin: 0.25rem 0 0; color: #8b98a5; font-size: 0.9rem; }
  .split {
    display: flex;
    flex-wrap: wrap;
    align-items: stretch;
    min-height: calc(100vh - 66px);
  }
  .pane { flex: 1 1 380px; min-width: 0; }
  .code {
    border-right: 1px solid #232b31;
    overflow: auto;
  }
  .code pre {
    margin: 0;
    padding: 1.25rem;
    font-size: 0.85rem;
    line-height: 1.5;
    min-height: 100%;
  }
  .render {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }

  /* --- the actual giraffe layout under test --- */
  .hstack {
    display: inline-flex;
    flex-direction: row;
    align-items: stretch;
    gap: 10px;
    padding: 10px;
    background: hotpink;
  }
  .giraffe {
    aspect-ratio: 0.5;
    background: linear-gradient(0deg, red, blue);
  }
  .vstack {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    width: max-content;
  }
  .paragraph {
    width: 0;
    min-width: 100%;
    text-align: justify;
    font-size: 14px;
    color: white;
  }
</style>
</head>
<body>
  <header>
    <h1>{{ page.title }}</h1>
    <p>Source on the left, live render on the right. Note the giraffe collapses to zero width.</p>
  </header>

  <div class="split">
    <div class="pane code">
      {{ page.content | safe }}
    </div>
    <div class="pane render">
      <div class="hstack">
        <div class="giraffe"></div>
        <div class="vstack">
          <div style="color:white">Single line text</div>
          <div class="paragraph">Wrapping text with a lot of text that overflows. Wrapping text with a lot of text that overflows. Wrapping text with a lot of text that overflows.</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
