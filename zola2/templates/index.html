{% extends "base.html" %}

{% block content %}
<ul class="posts">
    {% for page in section.pages %}
    <li>
        <a href="{{ page.permalink }}">{{ page.title }}</a>
        {% if page.date %}<time>{{ page.date | date(format="%Y-%m-%d") }}</time>{% endif %}
    </li>
    {% endfor %}
</ul>
{% endblock %}
